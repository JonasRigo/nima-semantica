name: tests
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python deploy/stage_release.py /tmp/nima-release-source
      - run: python -m build --outdir /tmp/nima-artifacts /tmp/nima-release-source
      - run: python deploy/check_release.py /tmp/nima-artifacts/nima_semantica-*.tar.gz /tmp/nima-artifacts/nima_semantica-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: /tmp/nima-artifacts/*
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'macos-26']
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64'"
      - run: python -m pip install -c constraints-tested.txt -e '.[test,mcp]'
      - if: runner.os == 'Linux'
        run: docker build -f deploy/sympy.Dockerfile -t nima-sympy:1.14.0-pilot .
      - run: python -m pytest -q -ra --junitxml=test-results.xml
      - if: runner.os == 'Linux'
        run: NIMA_LIVE_SYMBOLIC=1 python -m pytest -q tests/test_symbolic_worker_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  langflow:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'macos-26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c constraints-tested.txt -e '.[test,langflow,mcp]'
      - if: runner.os == 'Linux'
        run: docker build -f deploy/sympy.Dockerfile -t nima-sympy:1.14.0-pilot .
      - run: python -m pytest -q -ra --junitxml=langflow-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langflow-${{ matrix.os }}
          path: langflow-results.xml
