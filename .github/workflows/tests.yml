name: tests
on: [push, pull_request]
jobs:
  macos-studio:
    runs-on: macos-15
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: /tmp/nima-artifacts
      - run: python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('/tmp/nima-artifacts').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '-c', 'constraints-tested.txt', str(wheel) + '[mcp]'], check=True)"
      - name: Build pinned upstream Studio using the documented macOS commands
        run: |
          xcode-select -p
          rustup update stable
          rustup default stable
          npm install --global pnpm@11.20.0
          git clone --branch v0.10.0 --depth 1 https://github.com/saschb2b/okf-studio.git "$RUNNER_TEMP/okf-studio"
          cd "$RUNNER_TEMP/okf-studio"
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Launch native Studio from the installed NIMA CLI
        env:
          NIMA_OKF_STUDIO: ${{ runner.temp }}/okf-studio/target/release/bundle/macos/OKF Studio.app/Contents/MacOS/okf-viewer
        run: python deploy/qualify_macos_studio.py "$RUNNER_TEMP/studio-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-studio-evidence
          path: ${{ runner.temp }}/studio-evidence
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python deploy/stage_release.py /tmp/nima-release-source
      - run: python -m build --outdir /tmp/nima-artifacts /tmp/nima-release-source
      - run: python deploy/check_release.py /tmp/nima-artifacts/nima_semantica-*.tar.gz /tmp/nima-artifacts/nima_semantica-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: /tmp/nima-artifacts/*
  contracts:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'macos-26']
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: /tmp/nima-artifacts
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64'"
      - run: python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('/tmp/nima-artifacts').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '-c', 'constraints-tested.txt', str(wheel) + '[test,mcp]'], check=True)"
      - run: python -c "import nima_semantica, pathlib, tomllib; assert not pathlib.Path(nima_semantica.__file__).resolve().is_relative_to(pathlib.Path('src').resolve()); assert nima_semantica.__version__ == tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']"
      - if: runner.os == 'Linux'
        run: docker build -f deploy/sympy.Dockerfile -t nima-sympy:1.14.0-pilot .
      - run: python -m pytest -q -ra --junitxml=test-results.xml
      - if: runner.os == 'Linux'
        run: NIMA_LIVE_SYMBOLIC=1 python -m pytest -q tests/test_symbolic_worker_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  langflow:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'macos-26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: /tmp/nima-artifacts
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('/tmp/nima-artifacts').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '-c', 'constraints-tested.txt', str(wheel) + '[test,langflow,mcp]'], check=True)"
      - run: python -c "import nima_semantica, pathlib, tomllib; assert not pathlib.Path(nima_semantica.__file__).resolve().is_relative_to(pathlib.Path('src').resolve()); assert nima_semantica.__version__ == tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']"
      - if: runner.os == 'Linux'
        run: docker build -f deploy/sympy.Dockerfile -t nima-sympy:1.14.0-pilot .
      - run: python -m pytest -q -ra --junitxml=langflow-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langflow-${{ matrix.os }}
          path: langflow-results.xml
